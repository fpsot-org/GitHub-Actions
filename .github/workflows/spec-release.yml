# SPDX-License-Identifier: Apache-2.0
#
# Runs when a spec repo pushes a release tag. Checks that the tag is a signed,
# annotated vX.Y.Z tag whose signature GitHub verified, then runs spec-check in strict mode: every page must exist
# in English and French, no French page may still be marked as pending, and no comparison row may be stale.
# Then it creates the GitHub release with the PDF books attached.
# The caller's job must grant `contents: write`, for the release; with read only,
# the checks still run and only the publish step fails.
# The notification to the website is added later.
name: spec-release
on:
  workflow_call:
    inputs:
      prefix:
        description: Requirement ID prefix, three upper-case letters.
        type: string
        required: true
      working-directory:
        description: Folder of the spec repo to check.
        type: string
        default: .
      tools-ref:
        description: Ref of fpsot-org/GitHub-Actions to take the tools from.
        type: string
        default: v0
      writing-ref:
        description: Passed to spec-check.
        type: string
        default: ''
      doc-ref:
        description: Passed to spec-check.
        type: string
        default: ''
      doc-rules:
        description: Passed to spec-check.
        type: boolean
        default: false
# No workflow-level permissions: each job states its own, and publish takes what the
# caller grants. Asking for more than the caller grants fails the run at startup.
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a tag push
        if: github.ref_type != 'tag'
        run: |
          echo "spec-release must run on a tag push, not ${{ github.ref_type }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: .fpsot-tools
      - name: Check the tag is annotated, named vX.Y.Z and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          bash .fpsot-tools/scripts/check-release-tag.sh "$TAG"
  strict-check:
    needs: tag
    permissions:
      contents: read
    uses: fpsot-org/GitHub-Actions/.github/workflows/spec-check.yml@v0
    with:
      prefix: ${{ inputs.prefix }}
      working-directory: ${{ inputs.working-directory }}
      strict: true
      tools-ref: ${{ inputs.tools-ref }}
      writing-ref: ${{ inputs.writing-ref }}
      doc-ref: ${{ inputs.doc-ref }}
      doc-rules: ${{ inputs.doc-rules }}
  publish:
    needs: strict-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spec-book
          path: book
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t pdfs < <(find book -name '*.pdf' 2>/dev/null | sort)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "See CHANGELOG.md for what changed." "${pdfs[@]}"
