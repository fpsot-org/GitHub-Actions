# SPDX-License-Identifier: Apache-2.0
#
# Runs when a spec repo pushes a release tag. Checks that the tag is a signed,
# annotated vX.Y.Z tag whose signature GitHub verified, then runs spec-check in strict mode: every page must exist
# in English and French, no French page may still be marked as pending, and no comparison row may be stale.
# Then it creates the GitHub release with the PDF books attached, plus the files of
# the caller's `extra-artifact` when it names one. That artifact must come from a job
# of the same run, which the caller's release job `needs`.
# The caller's job must grant `contents: write`, for the release; with read only,
# the checks still run and only the publish step fails.
# Then it tells the website to rebuild, through the fpsot-ci GitHub App: the caller
# passes `secrets: inherit` and the org sets FPSOT_CI_APP_CLIENT_ID and FPSOT_CI_APP_PRIVATE_KEY.
name: spec-release
on:
  workflow_call:
    inputs:
      prefix:
        description: Requirement ID prefix, three upper-case letters.
        type: string
        required: true
      working-directory:
        description: Folder of the spec repo to check.
        type: string
        default: .
      tools-ref:
        description: Ref of fpsot-org/GitHub-Actions to take the tools from.
        type: string
        default: v0
      writing-ref:
        description: Passed to spec-check.
        type: string
        default: ''
      doc-ref:
        description: Passed to spec-check.
        type: string
        default: ''
      doc-rules:
        description: Passed to spec-check.
        type: boolean
        default: false
      extra-artifact:
        description: Name of an artifact of this run whose files are also attached to the release.
        type: string
        default: ''
    secrets:
      FPSOT_CI_APP_PRIVATE_KEY:
        description: Private key of the fpsot-ci GitHub App, to notify the site.
        required: false
# No workflow-level permissions: each job states its own, and publish takes what the
# caller grants. Asking for more than the caller grants fails the run at startup.
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a tag push
        if: github.ref_type != 'tag'
        run: |
          echo "spec-release must run on a tag push, not ${{ github.ref_type }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: .fpsot-tools
      - name: Check the tag is annotated, named vX.Y.Z and verified by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          bash .fpsot-tools/scripts/check-release-tag.sh "$TAG"
  strict-check:
    needs: tag
    permissions:
      contents: read
    uses: fpsot-org/GitHub-Actions/.github/workflows/spec-check.yml@v0
    with:
      prefix: ${{ inputs.prefix }}
      working-directory: ${{ inputs.working-directory }}
      strict: true
      tools-ref: ${{ inputs.tools-ref }}
      writing-ref: ${{ inputs.writing-ref }}
      doc-ref: ${{ inputs.doc-ref }}
      doc-rules: ${{ inputs.doc-rules }}
  publish:
    needs: strict-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: .fpsot-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spec-book
          path: book
          merge-multiple: true
      - if: inputs.extra-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.extra-artifact }}
          path: extra
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXTRA: ${{ inputs.extra-artifact != '' && 'extra' || '' }}
        run: bash .fpsot-tools/scripts/release-create.sh "$GITHUB_REPOSITORY" "$TAG" book ${EXTRA:+"$EXTRA"}
  notify-site:
    needs: publish
    # The self-test calls this workflow from this repo, which never notifies the site.
    if: github.repository != 'fpsot-org/GitHub-Actions'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: .fpsot-tools
      - name: Check the App credentials
        env:
          FPSOT_CI_APP_CLIENT_ID: ${{ vars.FPSOT_CI_APP_CLIENT_ID }}
        run: bash .fpsot-tools/scripts/notify-site.sh --check
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FPSOT_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.FPSOT_CI_APP_PRIVATE_KEY }}
          owner: fpsot-org
          repositories: fpsot-org.github.io
      - name: Notify the site
        env:
          FPSOT_CI_APP_CLIENT_ID: ${{ vars.FPSOT_CI_APP_CLIENT_ID }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash .fpsot-tools/scripts/notify-site.sh
