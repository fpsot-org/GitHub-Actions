# SPDX-License-Identifier: Apache-2.0
#
# Builds the fpsot.org site, for the site repo. Each spec on the site's list
# (data/specs.yml), at its highest vX.Y.Z tag with a published release, is its own Roq build, in parallel ("map"),
# with the release's PDFs. "book" builds one PDF per language that holds every spec,
# from their sources at the same tags, and checks it with veraPDF. The pages that are
# not specs are one more build ("home"), with the book. "reduce" merges them, checks
# that the site makes no external requests, checks every link and uploads the GitHub
# Pages artifact. The Roq builds run in the website builder image
# (fpsot-org/fpsot-website-builder).
name: site-build
on:
  workflow_call:
    inputs:
      tools-ref:
        description: Ref of fpsot-org/GitHub-Actions to take the tools from.
        type: string
        default: v0
      working-directory:
        description: Folder of the site in the calling repo.
        type: string
        default: .
      builder-image:
        description: The website builder image, pinned by digest.
        type: string
        default: ghcr.io/fpsot-org/fpsot-website-builder@sha256:ac76e576a36cab1505f9bf057301a58a585b7eb0028aa6b1a24920a867d034fc
permissions:
  contents: read
env:
  TOOLS: .fpsot-tools
  GH_VERSION: 2.102.1
  GH_SHA256: 77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b
  PANDOC_VERSION: '3.13'
  PANDOC_SHA256: 7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f
jobs:
  specs:
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: ${{ env.TOOLS }}
      - id: list
        env:
          SITE: ${{ inputs.working-directory }}
          GH_TOKEN: ${{ github.token }}
        run: |
          specs=$(bash "$TOOLS/scripts/site-build.sh" specs "$SITE")
          echo "$specs"
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
  map:
    needs: specs
    runs-on: ubuntu-24.04
    container: ${{ inputs.builder-image }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.specs.outputs.specs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: ${{ env.TOOLS }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.TOOLS }}/tools/go.mod
          cache: false
      # The checkout belongs to another user in the container: do not stamp Git data.
      - run: go build -buildvcs=false -o "$RUNNER_TEMP/bin/" ./cmd/...
        working-directory: ${{ env.TOOLS }}/tools
      # The builder image has no Python, which reads each spec's license (spec-legal.py).
      - name: Install Python
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 >/dev/null
      # The builder image has no GitHub CLI, which downloads the release PDFs.
      - name: Install the GitHub CLI
        run: |
          curl -sfLo "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.repo }} ${{ matrix.tag }}
        env:
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          SITE: ${{ inputs.working-directory }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLS_BIN="$RUNNER_TEMP/bin" bash "$TOOLS/scripts/site-build.sh" map "$SITE" "$REPO" "$TAG" "$RUNNER_TEMP/part"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-part-${{ matrix.repo }}
          path: ${{ runner.temp }}/part
          if-no-files-found: error
  # One PDF per language with every spec, built from the sources at the same tags as
  # the pages, each spec as a part. It is rebuilt on every site build, so it never
  # lags behind a release.
  book:
    needs: specs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: ${{ env.TOOLS }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.TOOLS }}/tools/go.mod
          cache: false
      - run: go build -o "$RUNNER_TEMP/bin/" ./cmd/...
        working-directory: ${{ env.TOOLS }}/tools
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      - name: Install Asciidoctor, pandoc, LibreOffice and PDF tools
        run: |
          gem install asciidoctor -v 2.0.26 --no-document
          curl -sfLo "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui python3-uno python3-pikepdf poppler-utils "$RUNNER_TEMP/pandoc.deb" >/dev/null
      - name: Build the book
        env:
          SPECS: ${{ needs.specs.outputs.specs }}
        run: |
          mapfile -t args < <(jq -r '.[] | .repo, .tag' <<<"$SPECS")
          start=$SECONDS
          TOOLS_BIN="$RUNNER_TEMP/bin" bash "$TOOLS/scripts/site-build.sh" book "$RUNNER_TEMP/book" "${args[@]}"
          for pdf in "$RUNNER_TEMP"/book/*.pdf; do
            pdfinfo "$pdf" | grep -q '^Tagged: *yes'
            echo "$(basename "$pdf"): $(wc -c <"$pdf") bytes, $(pdfinfo "$pdf" | awk '/^Pages:/{print $2}') pages" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Built in $((SECONDS - start)) s." >> "$GITHUB_STEP_SUMMARY"
      - name: Check the book with veraPDF (PDF/UA-1 and PDF/A-2b)
        env:
          VERAPDF_IMAGE: docker.io/verapdf/cli@sha256:d74b7026c18a0f171e73c153b617fe6520e1511feb24ca98a348b2bb897669fb # v1.30.3
        run: |
          # The veraPDF image runs as a user that is not the owner of the folder.
          chmod -R a+rX "$RUNNER_TEMP/book"
          status=0
          for pdf in "$RUNNER_TEMP"/book/*.pdf; do
            for flavour in ua1 2b; do
              result=$(docker run --rm -v "$RUNNER_TEMP/book:/data" "$VERAPDF_IMAGE" --format text --flavour "$flavour" "/data/$(basename "$pdf")" 2>&1 | tail -1)
              echo "$result" | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ "$result" != PASS* ]]; then
                status=1
                docker run --rm -v "$RUNNER_TEMP/book:/data" "$VERAPDF_IMAGE" --format mrr --flavour "$flavour" "/data/$(basename "$pdf")" 2>/dev/null \
                  | grep -o 'clause="[^"]*" testNumber="[^"]*" status="failed"[^>]*' | sed 's/^/  /'
              fi
            done
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-book
          path: ${{ runner.temp }}/book
          if-no-files-found: error
  home:
    needs: book
    runs-on: ubuntu-24.04
    container: ${{ inputs.builder-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: ${{ env.TOOLS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-book
          path: ${{ runner.temp }}/book
      - env:
          SITE: ${{ inputs.working-directory }}
        run: bash "$TOOLS/scripts/site-build.sh" home "$SITE" "$RUNNER_TEMP/part" "$RUNNER_TEMP/book"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-part-home
          path: ${{ runner.temp }}/part
          if-no-files-found: error
  reduce:
    needs: [map, home]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fpsot-org/GitHub-Actions
          ref: ${{ inputs.tools-ref }}
          path: ${{ env.TOOLS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-part-*
          path: parts
      - name: Merge the parts
        run: bash "$TOOLS/scripts/site-build.sh" reduce site parts/*
      - name: Check that the site makes no external requests
        run: bash "$TOOLS/scripts/check-site-offline.sh" site
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments --index-files index.html
            --root-dir "${{ github.workspace }}/site"
            'site/**/*.html'
          fail: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
